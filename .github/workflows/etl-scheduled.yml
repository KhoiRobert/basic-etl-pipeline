# Scheduled ETL: requires PostgreSQL reachable from GitHub-hosted runners and repo secrets.
# Set secrets: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD (same as .env).
# Adjust cron schedule as needed (UTC).

name: ETL pipeline

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python main.py data/raw/data.csv
